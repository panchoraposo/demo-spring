apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhbk-operator-group
  namespace: rhbk-operator
spec:
  # Single shared Keycloak for the demo lives on the hub.
  # It runs in `banking-idp` and serves both app and TPA realms.
  targetNamespaces:
    - banking-idp
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: rhbk-operator
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  channel: stable-v26.6
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # Sandbox/hub clusters may be single-node with tight allocatable CPU.
  # Subscription config is immutable: to change resources, delete and let Argo recreate.
  config:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

