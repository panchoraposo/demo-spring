# DEPRECATED for multi-cluster: use gitops/bootstrap/acm-root.yaml on acm and
# RHACM ApplicationSets (gitops/acm) for east/west.
#
# Kept for emergency single-spoke bootstrap of east only (spoke apps — no Conjur/Jenkins):
#   oc apply -f gitops/bootstrap/root-app.yaml -n openshift-gitops
#
# Conjur + Jenkins must already be reachable on acm (ClusterSecretStore URL + creds synced).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-demo-root
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: banking-demo
    cluster: east
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/panchoraposo/demo-spring.git
    targetRevision: main
    path: gitops/applications/east
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
