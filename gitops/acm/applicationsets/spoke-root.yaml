# ApplicationSet on hub OpenShift GitOps.
# Prerequisites:
# 1. ManagedClusters east/west labeled banking-demo/role=managed and banking-demo/region=<name>
# 2. Hub Argo cluster secrets for east/west with the same banking-demo/role=managed label
# 3. Placement banking-managed selects those clusters
# 4. OpenShift GitOps installed on each managed cluster (operators-spoke / operators-managed)
#
# Generates Application banking-<name>-root syncing gitops/applications/<name> to that cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: banking-managed-roots
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            banking-demo/role: managed
  template:
    metadata:
      name: 'banking-{{name}}-root'
      namespace: openshift-gitops
      labels:
        app.kubernetes.io/part-of: banking-demo
        cluster: '{{name}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/panchoraposo/demo-spring.git
        targetRevision: main
        path: 'gitops/applications/{{name}}'
      destination:
        server: '{{server}}'
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        # Child Application CRs accumulate operation/status/annotations on managed clusters.
        - group: argoproj.io
          kind: Application
          jqPathExpressions:
            - .metadata.annotations
            - .metadata.labels
            - .operation
            - .status
