# Required by ApplicationSet clusterDecisionResource generator (RHACM + GitOps).
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-placement
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: banking-demo
data:
  apiVersion: cluster.open-cluster-management.io/v1beta1
  # NOTE: OpenShift GitOps ApplicationSet controller expects the *resource* name here.
  # Using Kind (PlacementDecision) makes it try to list resource "PlacementDecision" and fail RBAC/discovery.
  resource: placementdecisions
  statusListKey: decisions
  matchKey: clusterName
