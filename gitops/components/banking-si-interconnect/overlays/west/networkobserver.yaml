# Skupper Network Console (Kiali analogue for Service Interconnect traffic).
apiVersion: observability.skupper.io/v2alpha1
kind: NetworkObserver
metadata:
  name: banking-si
  namespace: banking-si-apps
  labels:
    app.kubernetes.io/part-of: banking-si-demo
spec:
  auth:
    strategy: openshift
    openshift:
      createCookieSecret: true
      serviceAccount:
        create: true
