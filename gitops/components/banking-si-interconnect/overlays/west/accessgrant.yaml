# West is the listening site for the demo link (east redeems an AccessToken).
# Token exchange is performed by scripts/si/link-sites.sh (not GitOps — short-lived).
apiVersion: skupper.io/v2alpha1
kind: AccessGrant
metadata:
  name: grant-west
  namespace: banking-si-apps
  labels:
    app.kubernetes.io/part-of: banking-si-demo
spec:
  # Demo link is re-established by scripts/si/link-sites.sh. Keep a multi-day
  # window so grants survive overnight and a Thursday afternoon workshop without
  # mid-day re-linking (existing Links keep working; grant is for new redemptions).
  redemptionsAllowed: 20
  expirationWindow: 168h
