  name: postgresql
  namespace: banking-si-db
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: banking-si-demo
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql
