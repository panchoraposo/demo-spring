apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus
  namespace: nexus
  labels:
    app.kubernetes.io/part-of: banking-demo
---
# Sonatype Nexus requires UID 200; grant anyuid in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-anyuid
  namespace: nexus
  labels:
    app.kubernetes.io/part-of: banking-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: nexus
    namespace: nexus
