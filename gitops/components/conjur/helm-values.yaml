# CyberArk Conjur OSS Helm values for OpenShift cluster east (demo).
# Chart: https://cyberark.github.io/helm-charts — conjur-oss
#
# Source of truth for GitOps is rendered-release.yaml + helm-secrets.yaml
# (Argo CD deletes Helm pre-install Secret hooks). Re-render after value changes:
#   helm template conjur-oss cyberark/conjur-oss --version 2.1.1 \
#     -n banking-conjur -f helm-values.yaml --skip-tests
#
# Apps never talk to Conjur directly. External Secrets Operator syncs
# Conjur variables into Kubernetes Secrets consumed by workloads.

account:
  name: banking
  create: true

authenticators: "authn"
logLevel: info

# Demo fixed data key (32-byte base64). Rotate for any non-demo use.
dataKey: "Yl/ai1C4jVUkqqLorR52RocmN8pm4LQD+EAwLlf/StM="

# Must match Secret conjur-oss-conjur-database-password / database-url in helm-secrets.yaml
database:
  password: conjur-db-change-me

openshift:
  enabled: false

image:
  repository: image-registry.openshift-image-registry.svc:5000/banking-conjur/conjur
  tag: "1.22"
  pullPolicy: Always

nginx:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/banking-conjur/nginx
    tag: "1.27"
    pullPolicy: Always

postgres:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/banking-conjur/postgres
    tag: "15"
    pullPolicy: Always
  persistentVolume:
    create: true
    size: 8Gi

replicaCount: 1

service:
  external:
    enabled: false
  internal:
    type: ClusterIP
    port: 443

ssl:
  hostname: conjur-oss.banking-conjur.svc
  altNames:
    - conjur.banking-conjur.svc
    - conjur-oss
    - conjur-oss.banking-conjur
    - conjur-oss.banking-conjur.svc.cluster.local
    - conjur-banking-conjur.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com
  expiration: 365

rbac:
  create: true

serviceAccount:
  create: true

exportAPIkey:
  enabled: false
