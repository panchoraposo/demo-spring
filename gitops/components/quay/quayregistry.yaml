# Red Hat Quay on acm. objectstorage:managed uses ODF ObjectBucketClaim (MCG).
# After Ready, create org `banking` and robot account for CI push/pull.
# Clair/mirror/HPA disabled: single-node sandbox cannot schedule Clair (2 CPU / 2Gi request).
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: banking-quay
  namespace: quay-enterprise
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  configBundleSecret: banking-quay-demo-config
  components:
    - kind: clair
      managed: false
    - kind: postgres
      managed: true
    - kind: objectstorage
      managed: true
    - kind: redis
      managed: true
    - kind: horizontalpodautoscaler
      managed: false
    - kind: route
      managed: true
    - kind: mirror
      managed: false
    # monitoring requires Quay Operator AllNamespaces install mode
    - kind: monitoring
      managed: false
    - kind: tls
      managed: true
    - kind: quay
      managed: true
      overrides:
        replicas: 1
    - kind: clairpostgres
      managed: false
