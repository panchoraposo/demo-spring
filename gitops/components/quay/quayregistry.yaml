# Red Hat Quay on acm. objectstorage:managed uses ODF ObjectBucketClaim (MCG).
# After Ready, create org `banking` and robot account for CI push/pull.
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: banking-quay
  namespace: quay-enterprise
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    - kind: clair
      managed: true
    - kind: postgres
      managed: true
    - kind: objectstorage
      managed: true
    - kind: redis
      managed: true
    - kind: horizontalpodautoscaler
      managed: true
    - kind: route
      managed: true
    - kind: mirror
      managed: true
    - kind: monitoring
      managed: true
    - kind: tls
      managed: true
    - kind: quay
      managed: true
    - kind: clairpostgres
      managed: true
