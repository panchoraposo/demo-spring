apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: tpa-sso
    app.kubernetes.io/part-of: banking-demo
type: Opaque
stringData:
  username: admin
  password: replace-me-keycloak-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-trustify
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: tpa-sso
    app.kubernetes.io/part-of: banking-demo
data:
  trustify-realm.json: |
    {
      "realm": "trustify",
      "enabled": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "clients": [
        {
          "clientId": "frontend",
          "name": "trustify-frontend",
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "attributes": {
            "client.use.lightweight.access.token.enabled": "false"
          },
          "defaultClientScopes": [
            "basic",
            "profile",
            "email",
            "roles",
            "web-origins",
            "read:document"
          ],
          "optionalClientScopes": [
            "create:document",
            "update:document",
            "delete:document",
            "offline_access"
          ],
          "redirectUris": [
            "https://server.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com/*"
          ],
          "webOrigins": [
            "*"
          ]
        },
        {
          "clientId": "cli",
          "name": "trustify-cli",
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "defaultClientScopes": [
            "basic",
            "profile",
            "email",
            "roles",
            "web-origins",
            "read:document",
            "create:document",
            "update:document",
            "delete:document"
          ],
          "clientAuthenticatorType": "client-secret",
          "secret": "replace-me-oidc-client-secret"
        }
      ],
      "clientScopes": [
        {
          "name": "basic",
          "protocol": "openid-connect",
          "protocolMappers": [
            {
              "name": "auth_time",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usersessionmodel-note-mapper",
              "consentRequired": false,
              "config": {
                "user.session.note": "AUTH_TIME",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "auth_time",
                "jsonType.label": "long"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "introspection.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        },
        { "name": "create:document", "protocol": "openid-connect" },
        { "name": "read:document", "protocol": "openid-connect" },
        { "name": "update:document", "protocol": "openid-connect" },
        { "name": "delete:document", "protocol": "openid-connect" }
      ],
      "users": [
        {
          "username": "tpaadmin",
          "enabled": true,
          "firstName": "TPA",
          "lastName": "Admin",
          "email": "tpaadmin@example.com",
          "emailVerified": true,
          "requiredActions": [],
          "credentials": [
            { "type": "password", "value": "replace-me-tpaadmin", "temporary": false }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpa-sso
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: tpa-sso
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tpa-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpa-sso
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          args:
            - start-dev
            - --http-port=8080
            - --proxy-headers=xforwarded
            - --hostname-strict=false
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HOSTNAME_URL
              value: https://sso.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 90
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 240
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-trustify
---
apiVersion: v1
kind: Service
metadata:
  name: tpa-sso
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: tpa-sso
spec:
  selector:
    app.kubernetes.io/name: tpa-sso
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sso
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: tpa-sso
spec:
  host: sso.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com
  to:
    kind: Service
    name: tpa-sso
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
