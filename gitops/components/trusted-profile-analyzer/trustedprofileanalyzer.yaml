# TrustedProfileAnalyzer instance. OIDC issuer + storage credentials must be
# filled before the operand becomes Ready. OBC tpa-storage creates ConfigMap/Secret
# with S3 endpoint; sync them into storage-credentials (see README).
#
# Placeholder OIDC: point IssuerURL at your RHBK / RH-SSO realm after create.
apiVersion: v1
kind: Secret
metadata:
  name: oidc-cli
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: banking-demo
type: Opaque
stringData:
  client-secret: replace-me-oidc-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-credentials
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: banking-demo
type: Opaque
stringData:
  # Populated from ObjectBucketClaim secret tpa-storage after ODF is Ready:
  #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (base64-decode from OBC secret)
  user: replace-me-from-obc
  password: replace-me-from-obc
---
apiVersion: trustify.redhat.com/v1alpha1
kind: TrustedProfileAnalyzer
metadata:
  name: banking-tpa
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Minimal demo shape — align field names with the installed operator CSV sample
  # if the CRD schema differs on your channel. Replace OIDC/storage after OBC binds.
  oidc:
    issuerUrl: REPLACE_ME_OIDC_ISSUER_URL
    clients:
      frontend:
        clientId: trusted-profile-analyzer
      cli:
        clientId: trusted-profile-analyzer-cli
        clientSecretName: oidc-cli
  storage:
    type: s3
    credentialsSecretName: storage-credentials
    # Endpoint from OBC ConfigMap tpa-storage (BUCKET_HOST / BUCKET_PORT)
    endpoint: REPLACE_ME_S3_ENDPOINT
    bucket: REPLACE_ME_S3_BUCKET
    region: us-east-1
  database:
    credentialsSecretName: postgresql-credentials
    adminCredentialsSecretName: postgresql-admin-credentials
