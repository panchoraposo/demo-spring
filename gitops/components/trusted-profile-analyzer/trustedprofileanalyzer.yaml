apiVersion: rhtpa.io/v1
kind: TrustedProfileAnalyzer
metadata:
  name: banking-tpa
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  # OpenShift apps domain (suffix only). Routes are created under this domain.
  # NOTE: rhtpa chart concatenates subdomains directly (e.g. "server" + appDomain),
  # so this value must start with a dot.
  appDomain: .apps.example.com
  partOf: trustify
  openshift:
    useServiceCa: true

  # Required by the chart schema (demo defaults).
  database:
    host: tpa-postgresql
    name: rhtpadb
    username: tpa
    # Keep value in sync with Conjur-seeded `banking/tpa/postgresql-db-password`.
    password: replace-me-tpa-db
    # Sandbox defaults: keep connection pool small.
    minimumConnections: 1
    maximumConnections: 10
  storage:
    type: filesystem
    size: 20Gi

  # Keep footprint small for single-node hubs.
  metrics:
    enabled: false
  tracing:
    enabled: false

  oidc:
    # UI requests these scopes from Keycloak; `read:document` is required for dashboards/APIs.
    uiScope: "openid read:document"

  # Init/migrations are expected at the top-level by the chart templates.
  createDatabase:
    enabled: true
  migrateDatabase:
    enabled: true

  # Runtime modules.
  modules:
    createImporters:
      enabled: true
      # Seed vulnerability/advisory sources so SBOM analysis works after install.
      # osv-github + cve cover Maven (RHDA-like); redhat-csaf covers RHEL RPMs in image SBOMs.
      # First sync can take a long time / significant storage on small hubs.
      importers:
        osv-github:
          osv:
            description: GitHub Advisory Database
            period: 1d
            source: https://github.com/github/advisory-database
            path: advisories
            disabled: false
        cve:
          cve:
            description: CVE list v5
            period: 1d
            source: https://github.com/CVEProject/cvelistV5
            disabled: false
        redhat-csaf:
          csaf:
            description: All Red Hat CSAF data
            period: 1d
            source: redhat.com
            disabled: false
            fetchRetries: 50
        redhat-sboms:
          sbom:
            description: All Red Hat SBOMs
            period: 1d
            source: https://security.access.redhat.com/data/sbom/v1/
            keys:
              - https://security.access.redhat.com/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
            disabled: true
            fetchRetries: 50
        quay-redhat-user-workloads:
          quay:
            description: SBOMs from konflux image attachments
            period: 1d
            source: quay.io
            namespace: redhat-user-workloads
            disabled: true
    server:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
    importer:
      enabled: true
      replicas: 1
      concurrency: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
      workingDirectory:
        size: 8Gi

