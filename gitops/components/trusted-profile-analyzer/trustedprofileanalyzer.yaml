apiVersion: rhtpa.io/v1
kind: TrustedProfileAnalyzer
metadata:
  name: banking-tpa
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  # OpenShift apps domain (suffix only). Routes are created under this domain.
  # NOTE: rhtpa chart concatenates subdomains directly (e.g. "server" + appDomain),
  # so this value must start with a dot.
  appDomain: .apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com
  partOf: trustify
  openshift:
    useServiceCa: true

  # Required by the chart schema (demo defaults).
  database:
    host: tpa-postgresql
    name: rhtpadb
    username: tpa
    password: replace-me-tpa-db
  storage:
    type: filesystem
    size: 20Gi

  # Keep footprint small for single-node hubs.
  metrics:
    enabled: false
  tracing:
    enabled: false

  # For sandbox/demo: allow running without an external OIDC provider.
  # When clients is empty, the server starts without validating an issuer URL.
  oidc:
    clients: {}
    loadUser: false

  # Init/migrations are expected at the top-level by the chart templates.
  createDatabase:
    enabled: true
  migrateDatabase:
    enabled: true

  # Runtime modules.
  modules:
    createImporters:
      enabled: true
    server:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
    importer:
      enabled: true
      replicas: 1
      concurrency: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
      workingDirectory:
        size: 8Gi

