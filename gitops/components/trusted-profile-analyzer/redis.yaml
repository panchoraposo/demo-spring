apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhda-redis
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: rhda-redis
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhda-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhda-redis
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rhda-redis
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: rhda-redis
spec:
  selector:
    app.kubernetes.io/name: rhda-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

