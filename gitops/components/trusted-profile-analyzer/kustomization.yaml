apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# RHTPA supporting resources + RHDA backend for Dev Spaces Dependency Analytics.
# Apply TrustedProfileAnalyzer CR from trustedprofileanalyzer.sample.yaml after
# aligning fields with the installed operator CSV sample (Tech Preview CRD).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: env-config-tpa
    envs:
      - env/tpa.env

resources:
  - externalsecrets.yaml
  - postgresql.yaml
  - redis.yaml
  - rhda-backend.yaml
  - realm-import-trustify.yaml
  - trustedprofileanalyzer.yaml

replacements:
  - source:
      kind: ConfigMap
      name: env-config-tpa
      fieldPath: data.TPA_APP_DOMAIN
    targets:
      - select:
          kind: TrustedProfileAnalyzer
          name: banking-tpa
        fieldPaths:
          - spec.appDomain
