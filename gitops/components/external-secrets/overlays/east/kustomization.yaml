apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  cluster: east

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: env-config-external-secrets
    envs:
      - env/conjur.env

replacements:
  - source:
      kind: ConfigMap
      name: env-config-external-secrets
      fieldPath: data.CONJUR_URL_SPOKE
    targets:
      - select:
          kind: ClusterSecretStore
          name: conjur-backend
        fieldPaths:
          - spec.provider.conjur.url

