apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-secret
  namespace: banking-idp
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: keycloak-db-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: banking/keycloak-db
        property: username
    - secretKey: password
      remoteRef:
        key: banking/keycloak-db
        property: password
---
