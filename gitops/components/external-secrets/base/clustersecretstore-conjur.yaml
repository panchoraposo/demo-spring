# Spoke ClusterSecretStore — Conjur runs on hub (acm).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: conjur-backend
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  provider:
    conjur:
      # Patched per environment (hub Conjur Route).
      url: https://conjur.apps.example.com
      caProvider:
        type: Secret
        name: conjur-ssl-ca
        key: tls.crt
        namespace: external-secrets
      auth:
        apikey:
          account: banking
          userRef:
            name: conjur-creds
            namespace: external-secrets
            key: hostid
          apiKeyRef:
            name: conjur-creds
            namespace: external-secrets
            key: apikey

