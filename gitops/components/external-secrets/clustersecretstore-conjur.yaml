# Spoke ClusterSecretStore — Conjur runs on hub (acm).
# Copy conjur-creds + CA with scripts/sync-conjur-creds-to-spokes.sh before sync.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: conjur-backend
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  provider:
    conjur:
      url: https://conjur-banking-conjur.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com
      caProvider:
        type: Secret
        name: conjur-ssl-ca
        key: tls.crt
        namespace: external-secrets
      auth:
        apikey:
          account: banking
          userRef:
            name: conjur-creds
            namespace: external-secrets
            key: hostid
          apiKeyRef:
            name: conjur-creds
            namespace: external-secrets
            key: apikey
