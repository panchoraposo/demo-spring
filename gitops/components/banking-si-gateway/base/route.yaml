apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    # Per-cluster OpenShift Route entry for the SI demo (east / west).
    route-type: si-cluster
spec:
  to:
    kind: Service
    name: api-gateway
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
