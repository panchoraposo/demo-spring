apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-si-apps

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: env-config-api-gateway
    envs:
      - env/api-gateway.env

resources:
  - ../../base
  - imagestream.yaml

# Pull from Quay (same tags as mesh). Avoid banking-apps ImageStream cross-ns pulls
# that fail with "authentication required" after scale-to-zero.
images:
  - name: image-registry.openshift-image-registry.svc:5000/banking-si-apps/api-gateway
    newName: banking-quay-quay-quay-enterprise.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com/banking/api-gateway
    newTag: "32"

commonLabels:
  cluster: west

replacements:
  - source:
      kind: ConfigMap
      name: env-config-api-gateway
      fieldPath: data.KEYCLOAK_ISSUER
    targets:
      - select:
          kind: ConfigMap
          name: api-gateway-config
        fieldPaths:
          - data.SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
  - source:
      kind: ConfigMap
      name: env-config-api-gateway
      fieldPath: data.KEYCLOAK_JWK_SET_URI
    targets:
      - select:
          kind: ConfigMap
          name: api-gateway-config
        fieldPaths:
          - data.SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
  - source:
      kind: ConfigMap
      name: env-config-api-gateway
      fieldPath: data.ROUTE_HOST
    targets:
      - select:
          kind: Route
          name: api-gateway
        fieldPaths:
          - spec.host
