# OpenShift Dev Spaces on spokes. Default workspaces use the repo .devfile/devfile.yaml
# (Spring Boot + Java + Red Hat Dependency Analytics → private TPA via RHDA backend).
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    dashboard: {}
    devfileRegistry: {}
    pluginRegistry: {}
    imagePuller:
      enable: false
    metrics:
      enable: true
  networking:
    auth:
      identityProviderURL: ""
  containerRegistry: {}
  devEnvironments:
    defaultNamespace:
      template: <username>-devspaces
    secondsOfInactivityBeforeIdling: 1800
    secondsOfRunBeforeIdling: -1
    maxNumberOfWorkspacesPerUser: 5
    storage:
      pvcStrategy: per-user
    defaultEditor: che-incubator/che-code/latest
    # Repo-level defaults: ./devfile.yaml + .vscode/extensions.json (Spring + RHDA).
    # Patched per environment via overlay env files.
    defaultComponents:
      - name: universal-developer-image
        container:
          image: registry.redhat.io/devspaces/udi-rhel9:latest
          memoryLimit: 6Gi
          memoryRequest: 2Gi
          cpuLimit: "2"
          cpuRequest: 500m
          mountSources: true
          env:
            - name: REDHAT_DEPENDENCY_ANALYTICS_EXHORT_BACKEND_URL
              value: REPLACE_ME_RHDA_BACKEND_URL
            - name: TPA_URL
              value: REPLACE_ME_TPA_URL
  gitServices: {}
