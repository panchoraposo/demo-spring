apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-service-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql.banking-db.svc.cluster.local:5432/banking
  # Bound by Spring Boot relaxed binding (resourceserver JWT)
  # Patched per environment/cluster overlay.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://sso.apps.example.com/realms/banking
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: https://sso.apps.example.com/realms/banking/protocol/openid-connect/certs
  # Mesh failover: accept JWTs issued by either spoke Keycloak (comma-separated).
  # Patched per environment.
  OIDC_TRUSTED_ISSUERS: https://sso.apps.example.com/realms/banking
