apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-service
  labels:
    app.kubernetes.io/name: banking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-service
    spec:
      containers:
        - name: banking-service
          image: image-registry.openshift-image-registry.svc:5000/banking-apps/banking-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: banking-service-config
            - secretRef:
                name: banking-service-db
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
