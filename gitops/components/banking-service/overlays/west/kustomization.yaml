apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-apps

resources:
  - ../../base
  - namespace.yaml
  - imagestream.yaml

images:
  - name: image-registry.openshift-image-registry.svc:5000/banking-apps/banking-service
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: banking-service-config
    patch: |-
      - op: replace
        path: /data/SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
        value: http://keycloak-banking.apps.cluster-mj6n9.mj6n9.sandbox990.opentlc.com/realms/banking
      - op: replace
        path: /data/OIDC_TRUSTED_ISSUERS
        value: http://keycloak-banking.apps.cluster-4487j.4487j.sandbox2772.opentlc.com/realms/banking,http://keycloak-banking.apps.cluster-mj6n9.mj6n9.sandbox990.opentlc.com/realms/banking

commonLabels:
  cluster: west
