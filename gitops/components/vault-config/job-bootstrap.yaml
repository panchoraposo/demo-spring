apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: banking-vault
  labels:
    app.kubernetes.io/part-of: banking-demo
    app.kubernetes.io/component: vault-config
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vault-bootstrap
      initContainers:
        - name: copy-vault-cli
          image: hashicorp/vault:1.17.6
          command: ["/bin/sh", "-c", "cp /bin/vault /vault-bin/vault"]
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
      containers:
        - name: bootstrap
          # Red Hat OpenShift CLI image (oc + python3 available on UBI-based tags)
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: VAULT_ADDR
              value: http://vault.banking-vault.svc:8200
            - name: NAMESPACE
              value: banking-vault
            - name: ROOT_SECRET_NAME
              value: vault-root-token
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: vault-bin
              mountPath: /vault-bin
      volumes:
        - name: scripts
          configMap:
            name: vault-bootstrap-script
            defaultMode: 0755
        - name: vault-bin
          emptyDir: {}
