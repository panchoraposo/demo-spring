apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-bootstrap-script
  namespace: banking-vault
  labels:
    app.kubernetes.io/part-of: banking-demo
data:
  bootstrap.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    export VAULT_ADDR="${VAULT_ADDR:-http://vault.banking-vault.svc:8200}"
    ROOT_SECRET_NAME="${ROOT_SECRET_NAME:-vault-root-token}"
    NS="${NAMESPACE:-banking-vault}"
    export PATH="/vault-bin:${PATH}"

    echo "Waiting for Vault at ${VAULT_ADDR}..."
    for i in $(seq 1 60); do
      if vault status >/dev/null 2>&1 || vault status 2>&1 | grep -qiE 'Initialized|Sealed'; then
        break
      fi
      # Uninitialized Vault still answers seal-status
      if curl -sf "${VAULT_ADDR}/v1/sys/seal-status" >/dev/null 2>&1; then
        break
      fi
      sleep 5
      if [[ "${i}" -eq 60 ]]; then
        echo "Vault did not become reachable" >&2
        exit 1
      fi
    done

    if ! oc get secret "${ROOT_SECRET_NAME}" -n "${NS}" >/dev/null 2>&1; then
      echo "Initializing Vault (demo: 1 key share / threshold 1)..."
      INIT_JSON="$(vault operator init -key-shares=1 -key-threshold=1 -format=json)"
      UNSEAL_KEY="$(printf '%s' "${INIT_JSON}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["unseal_keys_b64"][0])')"
      ROOT_TOKEN="$(printf '%s' "${INIT_JSON}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["root_token"])')"
      oc create secret generic "${ROOT_SECRET_NAME}" -n "${NS}" \
        --from-literal=root-token="${ROOT_TOKEN}" \
        --from-literal=unseal-key="${UNSEAL_KEY}" \
        --dry-run=client -o yaml | oc apply -f -
      echo "DEMO ONLY: root token stored in Secret ${NS}/${ROOT_SECRET_NAME}. Do not use this pattern in production."
    fi

    ROOT_TOKEN="$(oc get secret "${ROOT_SECRET_NAME}" -n "${NS}" -o jsonpath='{.data.root-token}' | base64 -d)"
    UNSEAL_KEY="$(oc get secret "${ROOT_SECRET_NAME}" -n "${NS}" -o jsonpath='{.data.unseal-key}' | base64 -d)"
    export VAULT_TOKEN="${ROOT_TOKEN}"

    if vault status -format=json 2>/dev/null | python3 -c 'import sys,json; raise SystemExit(0 if json.load(sys.stdin).get("sealed") else 1)'; then
      echo "Unsealing Vault..."
      vault operator unseal "${UNSEAL_KEY}" >/dev/null
    fi

    echo "Configuring KV v2, policy, Kubernetes auth, and seed secrets..."

    vault secrets enable -path=secret kv-v2 2>/dev/null || true

    vault policy write banking-eso-read - <<'EOF'
path "secret/data/banking/*" {
  capabilities = ["read"]
}
path "secret/metadata/banking/*" {
  capabilities = ["read", "list"]
}
EOF

    vault auth enable kubernetes 2>/dev/null || true

    vault write auth/kubernetes/config \
      kubernetes_host="https://kubernetes.default.svc" \
      disable_iss_validation=true

    vault write auth/kubernetes/role/banking-eso \
      bound_service_account_names=external-secrets \
      bound_service_account_namespaces=external-secrets \
      policies=banking-eso-read \
      ttl=1h

    vault kv put secret/banking/postgresql \
      database-name=banking \
      database-user=banking \
      database-password=banking-demo-change-me \
      jdbc-url='jdbc:postgresql://postgresql.banking-db.svc.cluster.local:5432/banking'

    vault kv put secret/banking/keycloak-db \
      username=keycloak \
      password=keycloak-db-change-me

    vault kv put secret/banking/keycloak-admin \
      username=admin \
      password=admin-change-me

    vault kv put secret/banking/banking-service \
      SPRING_DATASOURCE_USERNAME=banking \
      SPRING_DATASOURCE_PASSWORD=banking-demo-change-me

    vault kv put secret/banking/jenkins \
      jenkins-admin-user=admin \
      jenkins-admin-password=ChangeMeOnFirstLogin!

    echo "Vault bootstrap complete."
