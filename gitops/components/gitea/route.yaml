# Public OpenShift Route for the Gitea UI and HTTPS git clone.
# Short host: gitea.<apps-domain> (must match helm DOMAIN / ROOT_URL).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: banking-git
  labels:
    app.kubernetes.io/part-of: banking-demo
    app.kubernetes.io/name: gitea
    cluster: acm
spec:
  host: gitea.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com
  to:
    kind: Service
    name: gitea-http
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
