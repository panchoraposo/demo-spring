apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: banking-failover-compare
  namespace: acm-observability
  labels:
    app.kubernetes.io/part-of: banking-demo
    cluster: acm
  annotations:
    perses.dev/tags: "banking,failover,multi-cluster"
spec:
  config:
    display:
      name: "Banking failover compare (east vs west)"
      description: >-
        Side-by-side east/west ready replicas and HTTP request rate.
        Use during mesh or SI failover demos while traffic hits the entry Route.
    duration: 30m
    refreshInterval: 15s
    variables:
      - kind: ListVariable
        spec:
          name: apps_ns
          allowAllValue: false
          allowMultiple: false
          plugin:
            kind: StaticListVariable
            spec:
              values:
                - label: Mesh (banking-apps)
                  value: banking-apps
                - label: Service Interconnect (banking-si-apps)
                  value: banking-si-apps
          defaultValue: banking-apps
    panels:
      bankingReadyReplicas:
        kind: Panel
        spec:
          display:
            name: "banking-service ready replicas"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      max by (cluster) (
                        kube_deployment_status_replicas_ready{
                          namespace="$apps_ns",
                          deployment="banking-service",
                          cluster=~"east|west"
                        }
                      )
      gatewayReadyReplicas:
        kind: Panel
        spec:
          display:
            name: "api-gateway ready replicas"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      max by (cluster) (
                        kube_deployment_status_replicas_ready{
                          namespace="$apps_ns",
                          deployment="api-gateway",
                          cluster=~"east|west"
                        }
                      )
      eastRequestRate:
        kind: Panel
        spec:
          display:
            name: "EAST — HTTP request rate"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # Exclude actuator scrape noise; Spring uri templates look like /api/v1/...
                    query: >-
                      sum(
                        rate(http_server_requests_seconds_count{
                          namespace="$apps_ns",
                          cluster="east",
                          uri!~"/actuator.*"
                        }[5m])
                      ) or vector(0)
      westRequestRate:
        kind: Panel
        spec:
          display:
            name: "WEST — HTTP request rate"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      sum(
                        rate(http_server_requests_seconds_count{
                          namespace="$apps_ns",
                          cluster="west",
                          uri!~"/actuator.*"
                        }[5m])
                      ) or vector(0)
      bothRequestRate:
        kind: Panel
        spec:
          display:
            name: "HTTP request rate — east vs west"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      sum by (cluster) (
                        rate(http_server_requests_seconds_count{
                          namespace="$apps_ns",
                          cluster=~"east|west",
                          uri!~"/actuator.*"
                        }[5m])
                      )
    layouts:
      - kind: Grid
        spec:
          display:
            title: "Failover story"
            collapse:
              open: true
          items:
            # Ready replicas first — always populated from kube-state-metrics via promxy.
            - x: 0
              y: 0
              width: 12
              height: 7
              content:
                $ref: "#/spec/panels/bankingReadyReplicas"
            - x: 12
              y: 0
              width: 12
              height: 7
              content:
                $ref: "#/spec/panels/gatewayReadyReplicas"
            - x: 0
              y: 7
              width: 12
              height: 7
              content:
                $ref: "#/spec/panels/eastRequestRate"
            - x: 12
              y: 7
              width: 12
              height: 7
              content:
                $ref: "#/spec/panels/westRequestRate"
            - x: 0
              y: 14
              width: 24
              height: 7
              content:
                $ref: "#/spec/panels/bothRequestRate"
