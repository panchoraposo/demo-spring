# MCG/NooBaa standalone provides ObjectBucketClaim for Quay managed objectstorage
# and Trusted Profile Analyzer S3. Replace dbStorageClassName if the cluster
# default differs (gp3-csi / managed-csi / thin-csi).
apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  multiCloudGateway:
    dbStorageClassName: gp3-csi
    reconcileStrategy: standalone
