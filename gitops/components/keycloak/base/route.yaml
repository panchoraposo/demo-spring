apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sso
  namespace: banking-idp
  labels:
    app.kubernetes.io/name: keycloak
spec:
  # Must match Keycloak CR hostname (and OIDC issuer used by Spring apps).
  # Patched per environment/cluster overlay.
  host: sso.apps.example.com
  to:
    kind: Service
    name: banking-keycloak-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
