# Red Hat build of Keycloak CR (requires rhbk-operator).
# Replace apps.cluster-4487j.4487j.sandbox2772.opentlc.com with your OpenShift apps domain, e.g. apps.east.example.com
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: banking-keycloak
  namespace: banking-idp
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: banking-demo
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db
    database: keycloak
    port: 5432
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: keycloak-banking.apps.cluster-4487j.4487j.sandbox2772.opentlc.com
    strict: false
  ingress:
    enabled: false
  bootstrapAdmin:
    user:
      secret: keycloak-admin
