apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-idp

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: env-config-keycloak
    envs:
      - env/keycloak.env

resources:
  - ../../base

# Patch Keycloak hostname + Route host for the shared hub IdP.
replacements:
  - source:
      kind: ConfigMap
      name: env-config-keycloak
      fieldPath: data.KEYCLOAK_HOST
    targets:
      - select:
          group: k8s.keycloak.org
          version: v2alpha1
          kind: Keycloak
          name: banking-keycloak
        fieldPaths:
          - spec.hostname.hostname
      - select:
          kind: Route
          name: sso
        fieldPaths:
          - spec.host

