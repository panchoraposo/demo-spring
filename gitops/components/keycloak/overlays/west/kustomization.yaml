apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: k8s.keycloak.org
      version: v2alpha1
      kind: Keycloak
      name: banking-keycloak
    patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: keycloak-banking.apps.cluster-mj6n9.mj6n9.sandbox990.opentlc.com
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: banking-keycloak
    patch: |-
      - op: replace
        path: /spec/host
        value: keycloak-banking.apps.cluster-mj6n9.mj6n9.sandbox990.opentlc.com

commonLabels:
  cluster: west
