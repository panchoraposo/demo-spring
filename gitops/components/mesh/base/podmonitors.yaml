# Scrape ambient dataplane metrics into OpenShift user-workload monitoring
# so hub promxy → Kiali can draw traffic graphs.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-dataplane
  namespace: banking-apps
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  selector:
    matchExpressions:
      - key: gateway.networking.k8s.io/gateway-name
        operator: Exists
  podMetricsEndpoints:
    - path: /stats/prometheus
      portNumber: 15020
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ztunnel
  namespace: ztunnel
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  selector:
    matchLabels:
      app: ztunnel
  podMetricsEndpoints:
    - path: /metrics
      portNumber: 15020
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  selector:
    matchLabels:
      istio: pilot
  endpoints:
    - port: http-monitoring
      interval: 15s
