apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  version: v1.30-latest
  profile: ambient
  values:
    global:
      meshID: banking-mesh
      network: CLUSTER_NETWORK
      multiCluster:
        enabled: true
        clusterName: CLUSTER_NAME
    pilot:
      trustedZtunnelNamespace: ztunnel
      env:
        # Required for ambient multi-network (overlapping pod CIDRs → EW HBONE).
        AMBIENT_ENABLE_MULTI_NETWORK: "true"
        AMBIENT_ENABLE_BAGGAGE: "true"
    meshConfig:
      trustDomain: cluster.local
