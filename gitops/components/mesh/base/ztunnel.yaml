apiVersion: sailoperator.io/v1
kind: ZTunnel
metadata:
  name: default
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  namespace: ztunnel
  version: v1.30-latest
  values:
    ztunnel:
      # Required for ambient multi-network (overlapping pod CIDRs).
      network: CLUSTER_NETWORK
      multiCluster:
        clusterName: CLUSTER_NAME
      # Do NOT set sidecar.istio.io/inject here — the ztunnel Helm chart already
      # defines it; duplicating the key makes Sail post-render fail (ReconcileError)
      # and Kiali reports data-plane warnings (Istio state ZTunnelNotHealthy).
      podAnnotations:
        ambient.istio.io/redirection: "disabled"
