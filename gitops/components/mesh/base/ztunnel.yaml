apiVersion: sailoperator.io/v1
kind: ZTunnel
metadata:
  name: default
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: banking-demo
spec:
  namespace: ztunnel
  version: v1.30-latest
  values:
    ztunnel:
      # Required for ambient multi-network (overlapping pod CIDRs).
      network: CLUSTER_NETWORK
      multiCluster:
        clusterName: CLUSTER_NAME
      # Keep ztunnel out of ambient redirection / sidecar injection.
      podAnnotations:
        sidecar.istio.io/inject: "false"
        ambient.istio.io/redirection: "disabled"
