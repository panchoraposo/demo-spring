apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-apps

resources:
  - ../../base
  - imagestream.yaml

images:
  - name: image-registry.openshift-image-registry.svc:5000/banking-apps/api-gateway
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
        value: http://keycloak-banking.apps.cluster-mj6n9.mj6n9.sandbox990.opentlc.com/realms/banking

commonLabels:
  cluster: west
