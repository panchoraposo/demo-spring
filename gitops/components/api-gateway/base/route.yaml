apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  # Patched per overlay (gateway.<apps-domain>).
  host: gateway.apps.example.com
  to:
    kind: Service
    name: api-gateway
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

