# OpenShift 4.19+ Ingress Operator Gateway API controller.
# Safe to apply on every cluster; no-op if already present.
#
# OCP 4.20 ingress-operator defaults this subscription to OSSM 3.1 / Istio 1.26,
# which is wrong for this demo (OSSM 3.4 ambient on spokes + Sail 3.4 on hub).
# Override annotations are the supported escape hatch from cluster-ingress-operator.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-default
  labels:
    app.kubernetes.io/part-of: banking-si-demo
  annotations:
    unsupported.do-not-use.openshift.io/ossm-channel: stable-3.4
    unsupported.do-not-use.openshift.io/ossm-version: servicemeshoperator3.v3.4.0
    unsupported.do-not-use.openshift.io/istio-version: v1.28-latest
spec:
  controllerName: openshift.io/gateway-controller/v1
