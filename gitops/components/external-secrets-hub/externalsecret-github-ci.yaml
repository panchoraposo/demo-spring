# Optional: GitHub PAT used by Jenkins to push GitOps image-tag bumps.
# Seed Conjur variable banking/github-ci/token (and username) before relying on git push.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-ci
  namespace: banking-ci
  labels:
    app.kubernetes.io/part-of: banking-demo
    app.kubernetes.io/name: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: conjur-backend
  target:
    name: github-ci
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: banking/github-ci/username
    - secretKey: token
      remoteRef:
        key: banking/github-ci/token
