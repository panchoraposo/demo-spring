# OIDC client secret for non-interactive SBOM uploads to TPA.
# Stored in Conjur as banking/tpa/oidc-cli-client-secret and synced into banking-ci.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tpa-oidc-cli
  namespace: banking-ci
  labels:
    app.kubernetes.io/part-of: banking-demo
    app.kubernetes.io/name: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: conjur-backend
  target:
    name: tpa-oidc-cli
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: banking/tpa/oidc-cli-client-secret
