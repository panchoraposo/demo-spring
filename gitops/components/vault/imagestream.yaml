apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: vault
  namespace: banking-vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: banking-demo
spec:
  lookupPolicy:
    local: true
  tags:
    - name: "1.17.6"
      from:
        kind: DockerImage
        name: docker.io/hashicorp/vault:1.17.6
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local
