# Hub Kiali multi-cluster — observes east + west (ignore_home_cluster).
# Remote kubeconfig Secrets (label kiali.io/multiCluster=true) are created by
# scripts/mesh/sync-kiali-multicluster-secrets.sh
# Prometheus: promxy in acm-observability (scripts/mesh/sync-promxy.sh).
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: banking-demo
    cluster: acm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  auth:
    strategy: anonymous
  deployment:
    accessible_namespaces:
      - '**'
    cluster_wide_access: true
    instance_name: kiali
    view_only_mode: true
  clustering:
    ignore_home_cluster: true
    autodetect_secrets:
      enabled: true
      label: kiali.io/multiCluster=true
  kubernetes_config:
    cluster_name: acm
  external_services:
    prometheus:
      enabled: true
      url: http://promxy.acm-observability.svc.cluster.local:8082
      is_core: true
      auth:
        type: none
      health_check_url: http://promxy.acm-observability.svc.cluster.local:8082/-/healthy
      # promxy fans out to OpenShift Thanos Querier; enable thanos query tweaks
      thanos_proxy:
        enabled: true
        retention_period: 7d
        scrape_interval: 30s
    grafana:
      enabled: false
    tracing:
      enabled: false
