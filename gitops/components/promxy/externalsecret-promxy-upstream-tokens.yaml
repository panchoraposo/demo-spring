apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: promxy-upstream-tokens
  namespace: acm-observability
  labels:
    app.kubernetes.io/part-of: banking-demo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: conjur-backend
  target:
    name: promxy-upstream-tokens
    creationPolicy: Owner
    # Explicit CRD default — avoids perpetual OutOfSync with ServerSideApply.
    deletionPolicy: Retain
  data:
    - secretKey: east.token
      remoteRef:
        key: banking/promxy/east-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: west.token
      remoteRef:
        key: banking/promxy/west-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore

