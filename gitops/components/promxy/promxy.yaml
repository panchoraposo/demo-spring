apiVersion: apps/v1
kind: Deployment
metadata:
  name: promxy
  namespace: acm-observability
  labels:
    app.kubernetes.io/name: promxy
    app.kubernetes.io/part-of: banking-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: promxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promxy
    spec:
      containers:
        - name: promxy
          image: quay.io/jacksontj/promxy:v0.0.93
          args:
            - --config=/etc/promxy/config.yaml
            - --web.enable-lifecycle
          ports:
            - containerPort: 8082
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/promxy
            - name: tokens
              mountPath: /etc/promxy-tokens
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: config
          configMap:
            name: promxy-config
        - name: tokens
          secret:
            secretName: promxy-upstream-tokens
---
apiVersion: v1
kind: Service
metadata:
  name: promxy
  namespace: acm-observability
  labels:
    app.kubernetes.io/name: promxy
    app.kubernetes.io/part-of: banking-demo
spec:
  selector:
    app.kubernetes.io/name: promxy
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: promxy
  namespace: acm-observability
  labels:
    app.kubernetes.io/name: promxy
    app.kubernetes.io/part-of: banking-demo
spec:
  to:
    kind: Service
    name: promxy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

