apiVersion: v1
kind: ConfigMap
metadata:
  name: promxy-config
  namespace: acm-observability
  labels:
    app.kubernetes.io/part-of: banking-demo
data:
  config.yaml: |
    promxy:
      server_groups:
        - static_configs:
            - targets:
                - thanos-querier-openshift-monitoring.apps.cluster-4487j.4487j.sandbox2772.opentlc.com:443
          # Injected at query time for Perses / multi-cluster PromQL (cluster=east|west).
          labels:
            cluster: east
          ignore_error: true
          scheme: https
          http_client:
            tls_config:
              insecure_skip_verify: true
            bearer_token_file: /etc/promxy-tokens/east.token
        - static_configs:
            - targets:
                - thanos-querier-openshift-monitoring.apps.cluster-mj6n9.mj6n9.sandbox990.opentlc.com:443
          labels:
            cluster: west
          ignore_error: true
          scheme: https
          http_client:
            tls_config:
              insecure_skip_verify: true
            bearer_token_file: /etc/promxy-tokens/west.token

