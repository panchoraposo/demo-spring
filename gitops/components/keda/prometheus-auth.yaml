# Cluster-wide monitoring view for per-namespace keda-prometheus SAs
# (TriggerAuthentication + SA live in banking-apps / banking-si-apps).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keda-prometheus-banking-apps
  labels:
    app.kubernetes.io/part-of: banking-demo
    app.kubernetes.io/component: custom-metrics-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: keda-prometheus
    namespace: banking-apps
  - kind: ServiceAccount
    name: keda-prometheus
    namespace: banking-si-apps
