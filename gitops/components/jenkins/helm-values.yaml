# Values for the Jenkins Helm chart (charts.jenkins.io).
# Admin credentials come from ExternalSecret jenkins-admin (Conjur via ESO).
#
# Jobs are defined in JCasC (Job DSL). OpenShift JenkinsPipeline sync is NOT used
# (this is upstream Jenkins LTS, not the OpenShift Jenkins image).

controller:
  componentName: jenkins-controller
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "lts-jdk21"
    pullPolicy: IfNotPresent
  admin:
    existingSecret: jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  serviceType: ClusterIP
  ingress:
    enabled: false
  # Builds run on the controller (no separate agents).
  numExecutors: 2
  jenkinsUrl: https://jenkins-banking-ci.apps.cluster-k7kqp.k7kqp.sandbox3321.opentlc.com/
  # Chart maps proxyCompatability → excludeClientIPFromCrumb, removed in current LTS CasC schema.
  csrf:
    defaultCrumbIssuer:
      enabled: false
  # Use plugin-installation-manager with latest-tested plugins for this LTS line.
  installLatestPlugins: true
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - job-dsl
    - credentials-binding
    - plain-credentials
    - pipeline-stage-view
    - github
    - credentials
  additionalPlugins: []
  initializeOnce: false
  overwritePlugins: true
  overwritePluginsFromImage: true

  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # Inject GitHub PAT + optional Quay robot / cosign key for supply-chain stage.
  containerEnv:
    - name: GITHUB_CI_USERNAME
      valueFrom:
        secretKeyRef:
          name: github-ci
          key: username
          optional: true
    - name: GITHUB_CI_TOKEN
      valueFrom:
        secretKeyRef:
          name: github-ci
          key: token
          optional: true
    - name: QUAY_CI_USER
      valueFrom:
        secretKeyRef:
          name: quay-ci
          key: username
          optional: true
    - name: QUAY_CI_TOKEN
      valueFrom:
        secretKeyRef:
          name: quay-ci
          key: password
          optional: true
    - name: COSIGN_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          name: cosign-signing-key
          key: cosign.key
          optional: true
    - name: TPA_OIDC_CLIENT_ID
      value: cli
    - name: TPA_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: tpa-oidc-cli
          key: client-secret
          optional: true
  sidecars:
    configAutoReload:
      enabled: false
  JCasC:
    confd:
      enabled: false
    overwriteConfiguration: true
    configScripts:
      banking-demo: |
        jenkins:
          systemMessage: "Banking Demo CI — build → Quay SBOM/attest/sign (RHTAS) → GitOps"
          crumbIssuer:
            standard: {}
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-ci
                      username: "${GITHUB_CI_USERNAME:-git}"
                      password: "${GITHUB_CI_TOKEN:-replace-me}"
                      description: "GitHub PAT for GitOps tag-bump commits"
                  - usernamePassword:
                      scope: GLOBAL
                      id: quay-ci
                      username: "${QUAY_CI_USER:-banking+ci}"
                      password: "${QUAY_CI_TOKEN:-replace-me}"
                      description: "Quay robot for push of images/sbom/sig/att"
                  - string:
                      scope: GLOBAL
                      id: cosign-private-key
                      secret: "${COSIGN_PRIVATE_KEY:-}"
                      description: "Cosign private key PEM for CI signing (Rekor via RHTAS)"
        jobs:
          - script: |
              pipelineJob('banking-service-ci') {
                description('CI for apps/banking-service → Build → Quay (sbom/attest/sign) → GitOps')
                parameters {
                  booleanParam('FORCE_BUILD', true, 'Build even without path changes')
                  stringParam('GITOPS_BRANCH', 'main', 'Branch for GitOps commits')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/panchoraposo/demo-spring.git')
                        }
                        branches('*/main')
                        extensions {
                          pathRestriction {
                            includedRegions('apps/banking-service/.*\nci/Jenkinsfile.banking-service')
                            excludedRegions('')
                          }
                        }
                      }
                    }
                    scriptPath('ci/Jenkinsfile.banking-service')
                    lightweight(false)
                  }
                }
                triggers {
                  scm('H/3 * * * *')
                }
              }
          - script: |
              pipelineJob('api-gateway-ci') {
                description('CI for apps/api-gateway → Build → Quay (sbom/attest/sign) → GitOps')
                parameters {
                  booleanParam('FORCE_BUILD', true, 'Build even without path changes')
                  stringParam('GITOPS_BRANCH', 'main', 'Branch for GitOps commits')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/panchoraposo/demo-spring.git')
                        }
                        branches('*/main')
                        extensions {
                          pathRestriction {
                            includedRegions('apps/api-gateway/.*\nci/Jenkinsfile.api-gateway')
                            excludedRegions('')
                          }
                        }
                      }
                    }
                    scriptPath('ci/Jenkinsfile.api-gateway')
                    lightweight(false)
                  }
                }
                triggers {
                  scm('H/3 * * * *')
                }
              }

agent:
  enabled: false

persistence:
  enabled: true
  size: 20Gi
