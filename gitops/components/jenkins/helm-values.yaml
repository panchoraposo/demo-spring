# Values for the Jenkins Helm chart (charts.jenkins.io).
# Admin credentials come from ExternalSecret jenkins-admin (Vault via ESO).
#
# Note: registry.redhat.io/ocp-tools-4/jenkins-rhel8 is not drop-in compatible with
# charts.jenkins.io (different entrypoint/args). For this demo we run the upstream
# LTS image on OpenShift with anyuid SCC on ServiceAccount jenkins.

controller:
  componentName: jenkins-controller
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.492.3-lts-jdk21"
    pullPolicy: IfNotPresent
  admin:
    existingSecret: jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  serviceType: ClusterIP
  ingress:
    enabled: false
  installPlugins:
    - kubernetes:latest
    - git:latest
    - workflow-aggregator:latest
    - credentials-binding:latest
    - configuration-as-code:latest
  initializeOnce: true
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  sidecars:
    configAutoReload:
      enabled: false
  JCasC:
    confd:
      enabled: false
    configScripts:
      banking-demo: |
        jenkins:
          systemMessage: "Banking Demo CI — OpenShift cluster east"
        unclassified:
          location:
            url: https://jenkins-banking-ci.apps.cluster-4487j.4487j.sandbox2772.opentlc.com/

agent:
  enabled: true
  image:
    registry: docker.io
    repository: jenkins/inbound-agent
    tag: "3283.v92c105e0f819-8"

persistence:
  enabled: true
  size: 20Gi
