# Values for the Jenkins Helm chart (charts.jenkins.io).
# Admin credentials come from ExternalSecret jenkins-admin (Vault via ESO).
# Images come from the OpenShift samples ImageStreams (redhat.io ocp-tools-4).

controller:
  componentName: jenkins-controller
  image:
    registry: image-registry.openshift-image-registry.svc:5000
    repository: openshift/jenkins
    tag: "2"
    pullPolicy: IfNotPresent
  admin:
    existingSecret: jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  serviceType: ClusterIP
  ingress:
    enabled: false
  installPlugins: []
  # OpenShift Jenkins image ships with curated plugins; avoid upstream plugin manager conflicts.
  initializeOnce: true
  # OpenShift SCC: allow the chart's UID 1000 (pair with anyuid on SA jenkins).
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  # Disable config-reload sidecar (kiwigrid) for a simpler OpenShift demo.
  sidecars:
    configAutoReload:
      enabled: false
  JCasC:
    confd:
      enabled: false
    configScripts:
      banking-demo: |
        jenkins:
          systemMessage: "Banking Demo CI — OpenShift cluster east"
        unclassified:
          location:
            url: https://jenkins.apps.cluster-4487j.4487j.sandbox2772.opentlc.com/

agent:
  enabled: true
  image:
    registry: image-registry.openshift-image-registry.svc:5000
    repository: openshift/jenkins-agent-base
    tag: latest

persistence:
  enabled: true
  size: 20Gi
