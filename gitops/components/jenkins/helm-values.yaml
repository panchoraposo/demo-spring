# Values for the Jenkins Helm chart (charts.jenkins.io).
# Admin credentials come from ExternalSecret jenkins-admin (Vault via ESO).
#
# Use Jenkins LTS + empty installPlugins so the chart init container does not
# pull :latest plugins that require a newer core than the current LTS.

controller:
  componentName: jenkins-controller
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "lts-jdk21"
    pullPolicy: IfNotPresent
  admin:
    existingSecret: jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
  serviceType: ClusterIP
  ingress:
    enabled: false
  # Avoid plugin-manager failures against LTS; plugins can be added later in the UI.
  installPlugins: []
  additionalPlugins: []
  initializeOnce: true
  overwritePlugins: false
  overwritePluginsFromImage: false
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  sidecars:
    configAutoReload:
      enabled: false
  JCasC:
    confd:
      enabled: false
    configScripts:
      banking-demo: |
        jenkins:
          systemMessage: "Banking Demo CI — OpenShift cluster east"
        unclassified:
          location:
            url: https://jenkins-banking-ci.apps.cluster-4487j.4487j.sandbox2772.opentlc.com/

agent:
  enabled: false

persistence:
  enabled: true
  size: 20Gi
