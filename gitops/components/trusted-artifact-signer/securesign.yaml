# Red Hat Trusted Artifact Signer (Securesign) on acm.
# OIDC issuer is configured via gitops environment (`RHTAS_OIDC_ISSUER_URL`).
# For automated Jenkins signing the demo also supports a cosign key pair
# (secret banking-ci/cosign-signing-key) with Rekor transparency from this instance.
apiVersion: rhtas.redhat.com/v1alpha1
kind: Securesign
metadata:
  name: banking-securesign
  namespace: trusted-artifact-signer
  labels:
    app.kubernetes.io/part-of: banking-demo
    app.kubernetes.io/name: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  rekor:
    externalAccess:
      enabled: true
    monitoring:
      enabled: true
  trillian:
    database:
      create: true
    monitoring:
      enabled: true
  fulcio:
    externalAccess:
      enabled: true
    config:
      OIDCIssuers:
        - ClientID: trusted-artifact-signer
          Issuer: ""
          IssuerURL: ""
          Type: email
    certificate:
      organizationName: Banking Demo
      organizationEmail: banking-demo@example.com
      commonName: fulcio.banking-demo
    monitoring:
      enabled: true
  tuf:
    externalAccess:
      enabled: true
    keys:
      - name: rekor.pub
      - name: ctfe.pub
      - name: fulcio_v1.crt.pem
      - name: tsa.certchain.pem
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: 100Mi
  ctlog:
    monitoring:
      enabled: true
  tsa:
    externalAccess:
      enabled: true
    monitoring:
      enabled: true
    ntpMonitoring:
      enabled: true
    signer:
      certificateChain:
        rootCA:
          organizationName: Banking Demo
          organizationEmail: banking-demo@example.com
          commonName: tsa.banking-demo-root
        intermediateCA:
          - organizationName: Banking Demo
            organizationEmail: banking-demo@example.com
            commonName: tsa.banking-demo-intermediate
        leafCA:
          organizationName: Banking Demo
          organizationEmail: banking-demo@example.com
          commonName: tsa.banking-demo-leaf
