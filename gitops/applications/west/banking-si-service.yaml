apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-si-service
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: banking-si-demo
    cluster: west
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/panchoraposo/demo-spring.git
    targetRevision: main
    path: gitops/components/banking-si-service/overlays/west
  destination:
    server: https://kubernetes.default.svc
    namespace: banking-si-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: Namespace
      jqPathExpressions:
        - .metadata.labels
        - .metadata.annotations
