apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: banking-demo
    cluster: west
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/panchoraposo/demo-spring.git
    targetRevision: main
    path: gitops/components/external-secrets/overlays/west
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.annotations
        - .metadata.finalizers
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
        - .spec.target.deletionPolicy
    # Ignore OpenShift-mutated ns fields only — keep istio ambient labels on banking-*.
    - group: ""
      kind: Namespace
      jqPathExpressions:
        - .metadata.annotations["openshift.io/sa.scc.mcs"]
        - .metadata.annotations["openshift.io/sa.scc.supplemental-groups"]
        - .metadata.annotations["openshift.io/sa.scc.uid-range"]
        - .metadata.annotations["security.openshift.io/MinimallySufficientPodSecurityStandard"]
        - .metadata.labels["kubernetes.io/metadata.name"]
        - .metadata.labels["pod-security.kubernetes.io/audit"]
        - .metadata.labels["pod-security.kubernetes.io/audit-version"]
        - .metadata.labels["pod-security.kubernetes.io/warn"]
        - .metadata.labels["pod-security.kubernetes.io/warn-version"]
