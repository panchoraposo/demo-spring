apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Spoke east — no Conjur/Jenkins (those live on acm).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: banking-demo-env
    envs:
      - env/common.env

resources:
  # wave 0
  - platform-operators.yaml
  # wave 1
  - eso-operand.yaml
  - user-workload-monitoring.yaml
  - keda.yaml
  # wave 2
  - mesh.yaml
  - rhacs-secured.yaml
  # wave 3
  - external-secrets-config.yaml
  # wave 4+ mesh demo stack
  - postgresql.yaml
  - banking-service.yaml
  - api-gateway.yaml
  # wave 4+ Service Interconnect demo (isolated namespaces)
  - banking-si-postgresql.yaml
  - banking-si-service.yaml
  - banking-si-interconnect.yaml
  - banking-si-gateway.yaml

replacements:
  - source:
      kind: ConfigMap
      name: banking-demo-env
      fieldPath: data.GIT_REPO_URL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
  - source:
      kind: ConfigMap
      name: banking-demo-env
      fieldPath: data.GIT_TARGET_REVISION
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.targetRevision
