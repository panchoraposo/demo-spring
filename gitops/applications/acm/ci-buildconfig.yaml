apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-buildconfig
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: banking-demo
    cluster: acm
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/panchoraposo/demo-spring.git
    targetRevision: main
    path: ci/buildconfig
  destination:
    server: https://kubernetes.default.svc
    namespace: banking-ci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
