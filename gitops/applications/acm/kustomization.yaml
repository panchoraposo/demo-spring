apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hub acm — RHACM-managed GitOps app-of-apps for Conjur, Jenkins, hub ESO,
# ODF/Quay, Trusted Artifact Signer, Trusted Profile Analyzer.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: banking-demo-env
    envs:
      - env/common.env

resources:
  # wave 0
  - platform-operators.yaml
  # wave 1-2
  - acm-multicluster.yaml
  # wave 1
  - eso-operand.yaml
  - conjur.yaml
  - odf.yaml
  # wave 2
  - conjur-config.yaml
  - quay.yaml
  - trusted-artifact-signer.yaml
  # wave 3
  - external-secrets-config.yaml
  - promxy.yaml
  - trusted-profile-analyzer.yaml
  # wave 4+
  - devspaces.yaml
  - keycloak.yaml
  - trustify-realm.yaml
  - jenkins.yaml
  - ci-buildconfig.yaml
  - kiali-multicluster.yaml

replacements:
  - source:
      kind: ConfigMap
      name: banking-demo-env
      fieldPath: data.GIT_REPO_URL
    targets:
      - select: { kind: Application, name: platform-operators }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: eso-operand }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: conjur }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: odf }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: conjur-config }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: quay }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: trusted-artifact-signer }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: external-secrets-config }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: trusted-profile-analyzer }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: promxy }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: acm-multicluster }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: devspaces }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: keycloak }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: trustify-realm }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: ci-buildconfig }
        fieldPaths: [ spec.source.repoURL ]
      - select: { kind: Application, name: kiali-multicluster }
        fieldPaths: [ spec.source.repoURL ]
      # Multi-source apps: patch only the $values git source.
      - select: { kind: Application, name: jenkins }
        fieldPaths:
          - "spec.sources.[ref=values].repoURL"
  - source:
      kind: ConfigMap
      name: banking-demo-env
      fieldPath: data.GIT_TARGET_REVISION
    targets:
      - select: { kind: Application, name: platform-operators }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: eso-operand }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: conjur }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: odf }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: conjur-config }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: quay }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: trusted-artifact-signer }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: external-secrets-config }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: trusted-profile-analyzer }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: promxy }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: acm-multicluster }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: devspaces }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: keycloak }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: trustify-realm }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: ci-buildconfig }
        fieldPaths: [ spec.source.targetRevision ]
      - select: { kind: Application, name: kiali-multicluster }
        fieldPaths: [ spec.source.targetRevision ]
      # Multi-source apps: patch only the $values git source.
      - select: { kind: Application, name: jenkins }
        fieldPaths:
          - "spec.sources.[ref=values].targetRevision"
