schemaVersion: 2.2.2
metadata:
  name: banking-spring-demo
  displayName: Banking Spring Demo
  description: Spring Boot banking apps with Java, Spring tools, and Red Hat Dependency Analytics (private TPA).
  tags:
    - java
    - spring
    - maven
    - openshift
  projectType: springboot
  language: java
  version: 1.0.0
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 6Gi
      memoryRequest: 2Gi
      cpuLimit: "2"
      cpuRequest: 500m
      mountSources: true
      endpoints:
        - name: http-banking
          targetPort: 8080
          exposure: public
          protocol: http
        - name: http-gateway
          targetPort: 8081
          exposure: public
          protocol: http
      env:
        - name: JAVA_HOME
          value: /usr/lib/jvm/java-21-openjdk
        - name: MAVEN_OPTS
          value: "-Xmx2g"
        # In-cluster Nexus on acm (maven-central + Red Hat GA group).
        - name: MAVEN_SETTINGS
          value: ${PROJECT_SOURCE}/ci/maven/settings.xml
commands:
  - id: build-banking-service
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/apps/banking-service
      commandLine: mvn -B -s ${PROJECT_SOURCE}/ci/maven/settings.xml -DskipTests package
      group:
        kind: build
        isDefault: true
  - id: build-api-gateway
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/apps/api-gateway
      commandLine: mvn -B -s ${PROJECT_SOURCE}/ci/maven/settings.xml -DskipTests package
      group:
        kind: build
  - id: run-banking-service
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/apps/banking-service
      commandLine: mvn -B -s ${PROJECT_SOURCE}/ci/maven/settings.xml spring-boot:run
      group:
        kind: run
        isDefault: true
  - id: run-api-gateway
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/apps/api-gateway
      commandLine: mvn -B -s ${PROJECT_SOURCE}/ci/maven/settings.xml spring-boot:run -Dspring-boot.run.arguments=--server.port=8081
      group:
        kind: run
