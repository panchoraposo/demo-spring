all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    acm_context: acm
    east_context: east
    west_context: west

    # ManagedCluster names/regions/contexts (must match ACM join + oc contexts)
    managed_clusters:
      - { name: east, region: east, context: east }
      - { name: west, region: west, context: west }

    # Git repo used by Argo CD Applications / ApplicationSets
    git_repo_url: https://github.com/panchoraposo/demo-spring.git
    git_target_revision: main

    # After configure_environment rewrites sandbox hosts for this env, commit+push
    # so Argo can sync the updated *.env / promxy / Quay image hosts.
    # Prefer a per-environment branch or fork.
    auto_push_env: false

    # Set true on a brand-new env before the first CI build; keep false when reusing existing tags
    reset_image_tags: false

    # Optional overrides (configure_environment discovers these from live Routes)
    # conjur_url_spoke: https://conjur-banking-conjur.apps.example.com
    # east_thanos_host: thanos-querier-openshift-monitoring.apps.east.example.com
    # west_thanos_host: thanos-querier-openshift-monitoring.apps.west.example.com

    # Hub worker scale target for Dev Spaces / Jenkins / ODF (hub_capacity)
    hub_worker_replicas: 1

    # Kiali hub namespace
    kiali_namespace: istio-system

    # Optional postflight mesh failover check
    run_failover_test: false

    # Failover demos use per-cluster OpenShift Routes (no shared global DNS):
    # Mesh:  ./scripts/demo-mesh-failover.sh
    # SI:    ./scripts/si/link-sites.sh && ./scripts/demo-si-failover.sh
    # Docs:  docs/multi-cluster.md , docs/service-interconnect-failover.md

