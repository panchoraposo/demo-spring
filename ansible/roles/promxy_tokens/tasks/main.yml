---
- name: Create SA on managed clusters and generate Thanos bearer tokens
  ansible.builtin.shell: |
    set -euo pipefail
    ns="istio-system"
    sa="acm-thanos-reader"
    ctx="{{ item }}"
    oc --context "${ctx}" -n "${ns}" create sa "${sa}" --dry-run=client -o yaml | oc --context "${ctx}" apply -f -
    oc --context "${ctx}" adm policy add-cluster-role-to-user cluster-monitoring-view "system:serviceaccount:${ns}:${sa}" >/dev/null
    oc --context "${ctx}" -n "${ns}" create token "${sa}" --duration=8760h
  args:
    executable: /bin/bash
  loop: "{{ spoke_contexts }}"
  register: spoke_tokens
  changed_when: true

- name: Map tokens to variables
  ansible.builtin.set_fact:
    promxy_east_token: "{{ (spoke_tokens.results | selectattr('item','equalto', east_context) | first).stdout | trim }}"
    promxy_west_token: "{{ (spoke_tokens.results | selectattr('item','equalto', west_context) | first).stdout | trim }}"

- name: Store promxy tokens in Conjur (hub Route) and force ESO sync
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT="$(cd "{{ playbook_dir }}/../.." && pwd)"
    # shellcheck disable=SC1091
    source "${ROOT}/scripts/lib/conjur.sh"
    conjur_init
    conjur_set_var "banking/promxy/east-token" "{{ promxy_east_token }}"
    conjur_set_var "banking/promxy/west-token" "{{ promxy_west_token }}"
    eso_force_sync "{{ acm_context }}" acm-observability promxy-upstream-tokens

    for i in $(seq 1 60); do
      ready="$(oc --context "{{ acm_context }}" -n acm-observability get externalsecret promxy-upstream-tokens \
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
      if [[ "${ready}" == "True" ]]; then
        echo "ExternalSecret promxy-upstream-tokens Ready"
        exit 0
      fi
      sleep 2
    done
    echo "WARN: ExternalSecret not Ready yet; tokens are in Conjur" >&2
    exit 0
  args:
    executable: /bin/bash
  changed_when: true
