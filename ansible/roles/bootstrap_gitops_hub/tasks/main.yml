---
- name: Check hub OpenShift GitOps server
  ansible.builtin.command: >
    oc --context "{{ acm_context }}" -n openshift-gitops get deploy openshift-gitops-server
  register: hub_gitops_deploy
  changed_when: false
  failed_when: false

- name: Install OpenShift GitOps Operator subscription on hub when missing
  when: hub_gitops_deploy.rc != 0
  ansible.builtin.command: >
    oc --context "{{ acm_context }}" apply -f gitops/platform/operators/subscription-openshift-gitops.yaml
  args:
    chdir: "{{ playbook_dir }}/../.."
  changed_when: true

- name: Wait for hub OpenShift GitOps server after subscription
  when: hub_gitops_deploy.rc != 0
  ansible.builtin.shell: |
    set -euo pipefail
    for i in $(seq 1 60); do
      if oc --context "{{ acm_context }}" -n openshift-gitops get deploy openshift-gitops-server >/dev/null 2>&1; then
        oc --context "{{ acm_context }}" -n openshift-gitops rollout status deploy/openshift-gitops-server --timeout=300s
        exit 0
      fi
      echo "[$i] waiting for openshift-gitops-server"
      sleep 10
    done
    echo "ERROR: OpenShift GitOps server did not become ready" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure hub has capacity for Dev Spaces (optional)
  ansible.builtin.import_role:
    name: hub_capacity

- name: Render hub root Application manifest
  ansible.builtin.template:
    src: acm-root.yaml.j2
    dest: "{{ playbook_dir }}/.rendered-acm-root.yaml"
    mode: "0644"

- name: Apply hub root Application
  ansible.builtin.command: >
    oc --context "{{ acm_context }}" -n openshift-gitops apply -f "{{ playbook_dir }}/.rendered-acm-root.yaml"
  changed_when: true
