---
- name: Label ManagedClusters for banking ApplicationSets
  ansible.builtin.command: >
    oc --context "{{ acm_context }}" label managedcluster {{ item.name }}
    cluster.open-cluster-management.io/clusterset=banking-spokes
    banking-demo/role=spoke
    banking-demo/region={{ item.region }}
    --overwrite
  changed_when: true
  loop:
    - { name: "east", region: "east" }
    - { name: "west", region: "west" }

